name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          CALLMANAGER_RELEASE_KEYSTORE_BASE64: ${{ secrets.CALLMANAGER_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$CALLMANAGER_RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build signed release AAB and APK
        env:
          ORG_GRADLE_PROJECT_CALLMANAGER_RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          ORG_GRADLE_PROJECT_CALLMANAGER_RELEASE_STORE_PASSWORD: ${{ secrets.CALLMANAGER_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_CALLMANAGER_RELEASE_KEY_ALIAS: ${{ secrets.CALLMANAGER_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_CALLMANAGER_RELEASE_KEY_PASSWORD: ${{ secrets.CALLMANAGER_RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Clean up keystore
        if: always()
        run: rm -f release.jks

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
