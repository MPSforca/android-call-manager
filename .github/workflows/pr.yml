name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Pin installed Android SDK platforms to compileSdk 35
        run: find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-*' ! -name 'android-35' -exec rm -rf {} +
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Pin installed Android SDK platforms to compileSdk 35
        run: find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-*' ! -name 'android-35' -exec rm -rf {} +
      - uses: gradle/actions/setup-gradle@v6
      - name: TEMP thread dump
        run: |
          (sleep 540; for p in $(pgrep -f 'Gradle Test Executor'); do echo "=== $p"; jstack $p; done; pkill -f gradlew; pkill -f GradleWrapperMain) > /tmp/dump.txt 2>&1 &
          ./gradlew testDebugUnitTest koverXmlReport verifyCoreCoverage || true
          cat /tmp/dump.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/kover

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Pin installed Android SDK platforms to compileSdk 35
        run: find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-*' ! -name 'android-35' -exec rm -rf {} +
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew detekt ktlintCheck lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/detekt
            app/build/reports/ktlint
            app/build/reports/lint-results-debug.html

  pr-title:
    name: PR title lint
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
