name: Pages

# Publishes site/ plus PRIVACY.md (the single source of truth for the policy) to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - PRIVACY.md
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Add the privacy policy to the site
        run: |
          {
            printf -- '---\ntitle: Privacy Policy\npermalink: /privacy/\n---\n\n'
            cat PRIVACY.md
          } > site/privacy.md
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v4
