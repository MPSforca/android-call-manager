build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20

naming:
  FunctionNaming:
    # Compose functions (e.g. `CallManagerApp`) are PascalCase by convention.
    functionPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)|(`.*`)'

comments:
  active: false
