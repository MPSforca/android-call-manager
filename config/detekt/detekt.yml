build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateMember:
    # @Preview composables are only ever invoked by tooling (Android Studio / screenshot tests),
    # never from other code, so detekt can't see a call site — exempt them rather than the whole
    # rule.
    ignoreAnnotated: ['Preview']

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20

naming:
  FunctionNaming:
    # Compose functions (e.g. `CallManagerApp`) are PascalCase by convention.
    functionPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)|(`.*`)'

comments:
  active: false
